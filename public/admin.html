<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Админ-панель — Ножки для стульев</title><link rel="stylesheet" href="/style.css"><script src="/admin.js" type="module"></script></head><body class="admin-shell">
<header class="admin-top"><a class="brand" href="/">НОЖКИ <span>ДЛЯ СТУЛЬЕВ</span></a><a href="/">← На сайт</a></header><main class="admin-wrap"><div class="eyebrow">Управление каталогом</div><h1>Админ-панель</h1>
<p id="loading" role="status">Загрузка…</p>
<form id="login" class="admin-card login-card" hidden><h2>Вход для продавца</h2><p>Введите пароль от админки.</p><div class="admin-fields"><label>Пароль<input id="login-password" type="password" autocomplete="current-password" required maxlength="128"></label></div><button class="admin-button space-top" type="submit">Войти</button><p id="login-status" role="status"></p></form>
<div id="editor" class="editor-layout" hidden><div class="admin-actions"><span>Вы вошли как администратор</span><button id="logout" class="secondary-button">Выйти</button></div>
<section class="admin-card"><h2>Контакты и информация</h2><div class="admin-fields"><label>Телефон<input id="phone" maxlength="80" placeholder="Добавите позже"></label><label>Город<input id="city" maxlength="100" placeholder="Добавите позже"></label><label>Дополнительная информация<textarea id="note" maxlength="500" placeholder="Как связаться или получить товар"></textarea></label></div></section>
<section class="admin-card"><div class="admin-card-head"><div><h2>Товары</h2><p>Пустые и скрытые карточки на сайте не видны.</p></div><div class="product-tools"><span id="product-count"></span><button id="collapse-all" class="secondary-button">Свернуть все</button><button id="add" class="secondary-button">+ Добавить товар</button></div></div><div id="product-editors"></div></section>
<div class="save-row"><button id="save" class="admin-button">Сохранить изменения</button><span id="save-status" role="status"></span></div>
<details class="admin-card"><summary>Изменить пароль</summary><form id="password-form" class="space-top"><div class="admin-fields"><label>Текущий пароль<input id="current-password" type="password" autocomplete="current-password" required maxlength="128"></label><label>Новый пароль, от 5 символов<input id="new-password" type="password" autocomplete="new-password" required minlength="5" maxlength="128"></label><label>Повторите новый пароль<input id="repeat-password" type="password" autocomplete="new-password" required minlength="5" maxlength="128"></label></div><button class="secondary-button space-top">Изменить пароль</button><p id="password-status" role="status"></p></form></details>
</div></main></body></html>
